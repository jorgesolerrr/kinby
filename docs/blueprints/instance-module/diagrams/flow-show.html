<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kinby instance show and run · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · kinby instance module</p>
    <h1>Show and run: discover, load, validate, print</h1>

    <svg viewBox="0 0 1000 664" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-show-title flow-show-desc">
      <title id="flow-show-title">kinby instance show and run sequence</title>
      <desc id="flow-show-desc">Sequence for kinby instance show and kinby run: main calls discover_instance, which tries the four rules in order and calls load_instance on the first hit; load_instance loads .env and kinby.toml from disk and hands the table to _parse_manifest, which returns a Manifest; the Instance flows back to main, which prints it.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Lifelines: 100, 300, 500, 700, 900 -->
      <line x1="100" y1="128" x2="100" y2="560" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="300" y1="128" x2="300" y2="560" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="500" y1="128" x2="500" y2="560" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="700" y1="128" x2="700" y2="560" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="900" y1="128" x2="900" y2="560" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- LOOP fragment on discover_instance: the four rules -->
      <rect x="260" y="180" width="200" height="64" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="260" y="180" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="280" y="192" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
      <text x="312" y="204" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[D7: rules 1..4, first hit]</text>

      <!-- Activation bars -->
      <rect x="296" y="168" width="8" height="328" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="496" y="264" width="8" height="200" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="696" y="392" width="8" height="40" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="896" y="296" width="8" height="8" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="896" y="328" width="8" height="40" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- Messages -->
      <!-- M1 main -> discover_instance -->
      <line x1="100" y1="168" x2="296" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M2 discover_instance self: candidate / kinby.toml is_file -->
      <path d="M 304,216 H 332 Q 340,216 340,224 Q 340,232 332,232 H 312" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M3 discover_instance -> load_instance -->
      <line x1="304" y1="264" x2="496" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M4 load_instance -> disk: load_dotenv -->
      <line x1="504" y1="296" x2="896" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M5 load_instance -> disk: tomllib.load -->
      <line x1="504" y1="328" x2="896" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M6 disk -> load_instance: dict (return) -->
      <line x1="896" y1="360" x2="504" y2="360" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- M7 load_instance -> _parse_manifest -->
      <line x1="504" y1="392" x2="696" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M8 _parse_manifest -> load_instance: Manifest (return) -->
      <line x1="696" y1="424" x2="504" y2="424" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- M9 load_instance -> discover_instance: Instance (return) -->
      <line x1="496" y1="456" x2="304" y2="456" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- M10 discover_instance -> main: Instance (headline) -->
      <line x1="296" y1="488" x2="100" y2="488" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- M11 main self: _print_instance -->
      <path d="M 100,520 H 132 Q 140,520 140,528 Q 140,536 132,536 H 108" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Labels -->
      <rect x="116" y="152" width="168" height="12" rx="2" fill="#f5f5f5"/>
      <text x="200" y="162" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DISCOVER · DIR, OVERRIDE</text>

      <rect x="352" y="218" width="100" height="12" rx="2" fill="#f5f5f5"/>
      <text x="356" y="228" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">KINBY.TOML?</text>

      <rect x="316" y="248" width="168" height="12" rx="2" fill="#f5f5f5"/>
      <text x="400" y="258" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOAD · PATH, RULE, OVERRIDE</text>

      <rect x="540" y="280" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="290" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOAD_DOTENV .ENV</text>

      <rect x="540" y="312" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="322" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOMLLIB.LOAD</text>

      <rect x="748" y="344" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="800" y="354" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DICT VALUES</text>

      <rect x="536" y="376" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="386" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PARSE · OVERRIDE</text>

      <rect x="536" y="408" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="418" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MANIFEST · D9 ERROR</text>

      <rect x="340" y="440" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="400" y="450" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INSTANCE</text>

      <rect x="132" y="472" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="200" y="482" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INSTANCE · RULE</text>

      <rect x="152" y="522" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="156" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">_PRINT_INSTANCE · EXIT 0/1</text>

      <!-- Actor boxes -->
      <rect x="28" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="28" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="36" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="50" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
      <text x="100" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">main</text>
      <text x="100" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cli/main.py</text>

      <rect x="228" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="228" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="236" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="252" y="89" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INST</text>
      <text x="300" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">discover_instance</text>
      <text x="300" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">instance/discovery.py</text>

      <rect x="428" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="428" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="436" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="452" y="89" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INST</text>
      <text x="500" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">load_instance</text>
      <text x="500" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">instance/manifest.py</text>

      <rect x="628" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="628" y="72" width="144" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="636" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="652" y="89" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INST</text>
      <text x="700" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">_parse_manifest</text>
      <text x="700" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">instance/manifest.py</text>

      <rect x="828" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="828" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="836" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="852" y="89" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DISK</text>
      <text x="900" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">&lt;instance&gt;/</text>
      <text x="900" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kinby.toml · .env</text>

      <!-- Legend -->
      <line x1="28" y1="584" x2="972" y2="584" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="28" y="600" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <line x1="28" y1="626" x2="56" y2="626" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="64" y="628" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Call</text>

      <line x1="132" y1="626" x2="160" y2="626" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="168" y="628" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return; a ManifestError takes the same path back</text>

      <line x1="452" y1="626" x2="480" y2="626" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="488" y="628" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">D7: the Instance carries its matching rule</text>

      <rect x="748" y="617" width="4" height="18" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="760" y="628" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Activation</text>
    </svg>
  </div>
</body>
</html>
