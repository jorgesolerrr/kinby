<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 728 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="birds-eye-title birds-eye-desc">
      <title id="birds-eye-title">Instance module data flow</title>
      <desc id="birds-eye-desc">Data flow of the instance module: the CLI either writes a starter instance through init_instance or resolves one through discover_instance, load_instance reads kinby.toml and .env from disk, _parse_manifest validates them into a Manifest, and the CLI prints the resolved Instance.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <style>
          .step-number, .step-label, .lane-label, .role-text, .chip-text, .legend-label { font-family: 'Geist Mono', ui-monospace, monospace; text-anchor: middle; }
          .step-number { fill: #2d3142; font-size: 7px; font-weight: 600; }
          .step-label { fill: #4f5d75; font-size: 7px; font-weight: 500; letter-spacing: 0.12em; }
          .lane-label { fill: #4f5d75; font-size: 8px; font-weight: 500; letter-spacing: 0.14em; }
          .role-text { fill: #2d3142; font-size: 6px; font-weight: 600; }
          .node-title { fill: #2d3142; font: 600 9px 'Geist', system-ui, sans-serif; text-anchor: middle; }
          .node-sub { fill: #4f5d75; font: 400 6.5px 'Geist Mono', ui-monospace, monospace; text-anchor: middle; }
          .node-tool { fill: #7a8399; font: 400 6.5px 'Geist Mono', ui-monospace, monospace; text-anchor: middle; }
          .chip-text { fill: #fff; font-size: 5px; font-weight: 700; }
          .focal-text { fill: #eb6c36; }
          .legend-label { fill: #4f5d75; font-size: 7px; font-weight: 500; letter-spacing: 0.12em; text-anchor: end; }
          .legend-text { fill: #4f5d75; font: 400 7px 'Geist', system-ui, sans-serif; }
        </style>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#4f5d75"/></marker>
        <marker id="arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#eb6c36"/></marker>
        <marker id="arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="728" height="356" fill="#f5f5f5"/>
      <rect width="728" height="356" fill="url(#dots)"/>
      <rect x="0" y="36" width="728" height="80" fill="rgba(45,49,66,0.018)"/>
      <rect x="0" y="196" width="728" height="80" fill="rgba(45,49,66,0.018)"/>

      <!-- Header and lane structure -->
      <line x1="0" y1="36" x2="728" y2="36" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="116" x2="728" y2="116" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="196" x2="728" y2="196" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="276" x2="728" y2="276" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="140" y1="36" x2="140" y2="276" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <g aria-label="Pipeline steps">
        <rect x="180" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="196" y="14" class="step-number">01</text><text x="196" y="29" class="step-label">COMMAND</text>
        <rect x="292" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="308" y="14" class="step-number">02</text><text x="308" y="29" class="step-label">DISCOVER</text>
        <rect x="404" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="420" y="14" class="step-number">03</text><text x="420" y="29" class="step-label">READ</text>
        <rect x="516" y="6" width="32" height="16" rx="8" fill="rgba(235,108,54,0.20)"/><text x="532" y="14" class="step-number focal-text">04</text><text x="532" y="29" class="step-label focal-text">VALIDATE</text>
        <rect x="628" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="644" y="14" class="step-number">05</text><text x="644" y="29" class="step-label">REPORT</text>
      </g>

      <g aria-label="Role lanes">
        <text x="70" y="72" class="lane-label">CLI</text><text x="70" y="84" class="lane-label">kinby.cli</text>
        <text x="70" y="152" class="lane-label">INSTANCE</text><text x="70" y="164" class="lane-label">kinby.instance</text>
        <text x="70" y="232" class="lane-label">DISK</text><text x="70" y="244" class="lane-label">instance dir</text>
      </g>

      <!-- Connectors first. Cross-lane paths use r=8 orthogonal elbows. -->
      <!-- main -> init_instance (same step, trigger) -->
      <line x1="196" y1="108" x2="196" y2="124" stroke="#4f5d75" stroke-dasharray="4,3" marker-end="url(#arr-muted)"/>
      <!-- init_instance -> instance dir (same step) -->
      <line x1="196" y1="188" x2="196" y2="204" stroke="#4f5d75" marker-end="url(#arr-muted)"/>
      <!-- main -> discover_instance -->
      <path d="M246 76 H300 Q308 76 308 84 V124" fill="none" stroke="#4f5d75" marker-end="url(#arr-muted)"/>
      <!-- instance dir -> load_instance -->
      <path d="M246 236 H412 Q420 236 420 228 V188" fill="none" stroke="#4f5d75" marker-end="url(#arr-muted)"/>
      <!-- discover_instance -> load_instance -->
      <path d="M358 156 H370" fill="none" stroke="#4f5d75" marker-end="url(#arr-muted)"/>
      <!-- load_instance -> _parse_manifest -->
      <path d="M470 156 H482" fill="none" stroke="#4f5d75" marker-end="url(#arr-muted)"/>
      <!-- _parse_manifest -> _print_instance (focal) -->
      <path d="M582 156 H636 Q644 156 644 148 V108" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)"/>
      <rect x="580" y="136" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="608" y="145" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INSTANCE</text>

      <!-- CLI: main parses argv -->
      <rect x="146" y="44" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="150" y="48" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="159" y="53" class="role-text">CLI</text>
      <text x="196" y="67" class="node-title">main</text><text x="196" y="79" class="node-sub">argv → dir · --model</text><text x="196" y="91" class="node-tool">cli/main.py</text>

      <!-- INSTANCE: init_instance -->
      <rect x="146" y="124" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="150" y="128" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="159" y="133" class="role-text">INS</text>
      <text x="196" y="147" class="node-title">init_instance</text><text x="196" y="159" class="node-sub">writes the starter tree</text><text x="196" y="171" class="node-tool">instance/init.py</text>

      <!-- DISK: the instance directory -->
      <rect x="146" y="204" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="150" y="208" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="159" y="213" class="role-text">DSK</text>
      <text x="196" y="227" class="node-title">&lt;instance&gt;/</text><text x="196" y="239" class="node-sub">kinby.toml · .env</text><text x="196" y="251" class="node-tool">D1: one directory</text>
      <rect x="226" y="258" width="16" height="8" rx="3" fill="#9c6b50"/><text x="234" y="264" class="chip-text">FL</text>

      <!-- INSTANCE: discover_instance -->
      <rect x="258" y="124" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="262" y="128" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="271" y="133" class="role-text">INS</text>
      <text x="308" y="147" class="node-title">discover_instance</text><text x="308" y="159" class="node-sub">D7: four rules</text><text x="308" y="171" class="node-tool">instance/discovery.py</text>

      <!-- INSTANCE: load_instance -->
      <rect x="370" y="124" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="374" y="128" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="383" y="133" class="role-text">INS</text>
      <text x="420" y="147" class="node-title">load_instance</text><text x="420" y="159" class="node-sub">.env · kinby.toml</text><text x="420" y="171" class="node-tool">instance/manifest.py</text>
      <rect x="374" y="178" width="16" height="8" rx="3" fill="#9c6b50"/><text x="382" y="184" class="chip-text">FL</text>

      <!-- INSTANCE: _parse_manifest (focal) -->
      <rect x="482" y="124" width="100" height="64" rx="6" fill="rgba(235,108,54,0.07)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="486" y="128" width="18" height="10" rx="3" fill="rgba(235,108,54,0.20)"/><text x="495" y="133" class="role-text focal-text">INS</text>
      <text x="532" y="147" class="node-title">_parse_manifest</text><text x="532" y="159" class="node-sub">D9: names the key</text><text x="532" y="171" class="node-tool">instance/manifest.py</text>

      <!-- CLI: _print_instance -->
      <rect x="594" y="44" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="598" y="48" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="607" y="53" class="role-text">CLI</text>
      <text x="644" y="67" class="node-title">_print_instance</text><text x="644" y="79" class="node-sub">the show summary</text><text x="644" y="91" class="node-tool">cli/main.py</text>

      <!-- Legend: steps -->
      <text x="164" y="293" class="legend-label">STEPS</text>
      <rect x="180" y="284" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/><text x="192" y="292" class="step-number">01</text><text x="212" y="293" class="legend-text">Command</text>
      <rect x="272" y="284" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/><text x="284" y="292" class="step-number">02</text><text x="304" y="293" class="legend-text">Discover</text>
      <rect x="360" y="284" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/><text x="372" y="292" class="step-number">03</text><text x="392" y="293" class="legend-text">Read</text>
      <rect x="468" y="284" width="24" height="12" rx="6" fill="rgba(235,108,54,0.20)"/><text x="480" y="292" class="step-number focal-text">04</text><text x="500" y="293" class="legend-text">Validate</text>
      <rect x="568" y="284" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/><text x="580" y="292" class="step-number">05</text><text x="600" y="293" class="legend-text">Report</text>

      <!-- Legend: data types -->
      <text x="164" y="314" class="legend-label">DATA TYPE</text>
      <rect x="180" y="306" width="16" height="8" rx="3" fill="#9c6b50"/><text x="188" y="312" class="chip-text">FL</text><text x="202" y="314" class="legend-text">kinby.toml and .env</text>
      <text x="300" y="314" class="legend-text">left chip = input · right chip = output</text>

      <!-- Legend: flow -->
      <text x="164" y="336" class="legend-label">FLOW</text>
      <line x1="180" y1="333" x2="204" y2="333" stroke="#4f5d75" marker-end="url(#arr-muted)"/><text x="212" y="336" class="legend-text">Call or handoff</text>
      <line x1="300" y1="333" x2="324" y2="333" stroke="#4f5d75" stroke-dasharray="4,3" marker-end="url(#arr-muted)"/><text x="332" y="336" class="legend-text">kinby init only</text>
      <line x1="420" y1="333" x2="444" y2="333" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)"/><text x="452" y="336" class="legend-text">Validated Instance to the user</text>
    </svg>
