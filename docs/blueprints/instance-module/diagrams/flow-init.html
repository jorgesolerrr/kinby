<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kinby init · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · kinby instance module</p>
    <h1>kinby init: refuse an existing instance, or write the starter tree</h1>

    <svg viewBox="0 0 1000 584" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-init-title flow-init-desc">
      <title id="flow-init-title">kinby init sequence</title>
      <desc id="flow-init-desc">Sequence for kinby init: main calls init_instance, which checks the instance directory for kinby.toml, either raises InstanceExistsError that main prints to stderr with exit 1, or writes the starter tree and returns the resolved path that main prints with exit 0.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Lifelines: 200, 500, 800 -->
      <line x1="200" y1="128" x2="200" y2="480" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="500" y1="128" x2="500" y2="480" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="800" y1="128" x2="800" y2="480" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ALT fragment: manifest exists / else -->
      <rect x="176" y="252" width="648" height="168" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="176" y="252" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="196" y="264" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
      <text x="228" y="272" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[kinby.toml exists]</text>
      <line x1="184" y1="340" x2="816" y2="340" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="228" y="360" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[else]</text>

      <!-- Activation bars -->
      <rect x="496" y="168" width="8" height="240" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="796" y="200" width="8" height="32" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="796" y="380" width="8" height="8" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- Messages -->
      <!-- M1 main -> init_instance -->
      <line x1="200" y1="168" x2="496" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M2 init_instance -> dir: is kinby.toml a file? -->
      <line x1="504" y1="200" x2="796" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M3 dir -> init_instance: return -->
      <line x1="796" y1="232" x2="504" y2="232" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- M4 init_instance -> main: InstanceExistsError (failure, dashed) -->
      <line x1="496" y1="296" x2="200" y2="296" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- M5 main self: stderr, exit 1 -->
      <path d="M 200,316 H 232 Q 240,316 240,324 Q 240,332 232,332 H 208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M6 init_instance -> dir: write the tree -->
      <line x1="504" y1="380" x2="796" y2="380" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M7 init_instance -> main: resolved path (headline) -->
      <line x1="496" y1="404" x2="200" y2="404" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- M8 main self: print, exit 0 -->
      <path d="M 200,440 H 232 Q 240,440 240,448 Q 240,456 232,456 H 208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Labels -->
      <rect x="264" y="152" width="172" height="12" rx="2" fill="#f5f5f5"/>
      <text x="350" y="162" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INIT_INSTANCE · DIR, MODEL</text>

      <rect x="576" y="184" width="148" height="12" rx="2" fill="#f5f5f5"/>
      <text x="650" y="194" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KINBY.TOML IS_FILE</text>

      <rect x="596" y="216" width="108" height="12" rx="2" fill="#f5f5f5"/>
      <text x="650" y="226" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRUE OR FALSE</text>

      <rect x="272" y="280" width="156" height="12" rx="2" fill="#f5f5f5"/>
      <text x="350" y="290" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INSTANCEEXISTSERROR</text>

      <rect x="252" y="318" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="256" y="328" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">STDERR · EXIT 1</text>

      <rect x="572" y="364" width="156" height="12" rx="2" fill="#f5f5f5"/>
      <text x="650" y="374" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WRITE 8 FILES, 6 DIRS</text>

      <rect x="292" y="388" width="116" height="12" rx="2" fill="#f5f5f5"/>
      <text x="350" y="398" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESOLVED PATH</text>

      <rect x="252" y="442" width="168" height="12" rx="2" fill="#f5f5f5"/>
      <text x="256" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">CREATED INSTANCE AT · EXIT 0</text>

      <!-- Actor boxes -->
      <rect x="128" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="128" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="136" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="150" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
      <text x="200" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">main</text>
      <text x="200" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cli/main.py</text>

      <rect x="428" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="428" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="436" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="452" y="89" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INST</text>
      <text x="500" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">init_instance</text>
      <text x="500" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">instance/init.py</text>

      <rect x="728" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="728" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="736" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="752" y="89" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DISK</text>
      <text x="800" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">&lt;dir&gt;</text>
      <text x="800" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the instance directory</text>

      <!-- Legend -->
      <line x1="28" y1="504" x2="972" y2="504" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="28" y="520" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <line x1="28" y1="546" x2="56" y2="546" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="64" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Call</text>

      <line x1="132" y1="546" x2="160" y2="546" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="168" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return, or a raised error</text>

      <line x1="332" y1="546" x2="360" y2="546" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="368" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">D4: the starter tree is written, nothing validated</text>

      <rect x="652" y="537" width="4" height="18" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="664" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Activation</text>
    </svg>
  </div>
</body>
</html>
