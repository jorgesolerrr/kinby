<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-replay-title flow-replay-desc">
      <title id="flow-replay-title">Replay for a late subscriber</title>
      <desc id="flow-replay-desc">Sequence for a subscriber that joins with after_sequence=0: the dispatcher admits the call, the event log reads the stored events for the thread from events.jsonl, yields them in order, then waits and yields live events.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Lifelines: 128, 380, 632, 884 -->
      <line x1="128" y1="128" x2="128" y2="568" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="380" y1="128" x2="380" y2="568" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="632" y1="128" x2="632" y2="568" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="884" y1="128" x2="884" y2="568" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Loop fragment: stored events -->
      <rect x="116" y="360" width="528" height="80" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="116" y="360" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="136" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
      <text x="164" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[stored event, sequence ≤ N]</text>

      <!-- Activation bars -->
      <rect x="376" y="176" width="8" height="96" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="628" y="272" width="8" height="272" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="880" y="304" width="8" height="32" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- Messages -->
      <!-- M1 client -> Dispatcher.subscribe -->
      <line x1="128" y1="176" x2="376" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M2 Dispatcher self: scope check + validate -->
      <path d="M 384 208 L 420 208 L 420 236 L 384 236" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M3 Dispatcher -> EventLog.subscribe(thread_id, 0) -->
      <line x1="384" y1="272" x2="628" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M4 EventLog -> events.jsonl: read and filter by thread -->
      <line x1="636" y1="304" x2="880" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M5 events.jsonl -> EventLog: stored events 1..N -->
      <line x1="880" y1="336" x2="636" y2="336" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- M6 EventLog -> client: yield stored event -->
      <line x1="628" y1="416" x2="128" y2="416" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <!-- M7 EventLog self: await queue.get() -->
      <path d="M 636 472 L 672 472 L 672 500 L 636 500" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M8 EventLog -> client: live event (headline) -->
      <line x1="628" y1="536" x2="128" y2="536" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Labels -->
      <rect x="182" y="160" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="254" y="170" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">THREAD.SUBSCRIBE · 0</text>

      <rect x="428" y="214" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="484" y="224" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">THREAD:READ · VALID</text>

      <rect x="454" y="256" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="506" y="266" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SUBSCRIBE(ID, 0)</text>

      <rect x="702" y="288" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="758" y="298" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READ · FILTER ID</text>

      <rect x="714" y="320" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="758" y="330" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVENTS 1..N</text>

      <rect x="330" y="400" width="100" height="12" rx="2" fill="#f5f5f5"/>
      <text x="380" y="410" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVENT SEQ ≤ N</text>

      <rect x="680" y="478" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="720" y="488" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WAIT LIVE</text>

      <rect x="326" y="520" width="108" height="12" rx="2" fill="#f5f5f5"/>
      <text x="380" y="530" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVENT SEQ N+1</text>

      <!-- Actor boxes -->
      <rect x="56" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="56" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="64" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="78" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
      <text x="128" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ContractClient</text>
      <text x="128" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cli/client.py · subscribe</text>

      <rect x="308" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="308" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="316" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="332" y="89" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <text x="380" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dispatcher</text>
      <text x="380" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">core/dispatcher.py</text>

      <rect x="560" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="568" y="80" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="586" y="89" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="632" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">EventLog</text>
      <text x="632" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">core/events.py · #31</text>

      <rect x="812" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="812" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="820" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="836" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FILE</text>
      <text x="884" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">events.jsonl</text>
      <text x="884" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">&lt;state_dir&gt;/events.jsonl</text>

      <!-- Legend -->
      <line x1="56" y1="584" x2="956" y2="584" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="56" y="600" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <line x1="56" y1="626" x2="84" y2="626" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="92" y="628" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Call</text>

      <line x1="160" y1="626" x2="188" y2="626" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="196" y="628" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return</text>

      <line x1="280" y1="626" x2="308" y2="626" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <text x="316" y="628" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Yielded on the subscription</text>

      <line x1="500" y1="626" x2="528" y2="626" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="536" y="628" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">D2: stream stays live after the replay</text>
    </svg>
