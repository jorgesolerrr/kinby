<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="module-map-title module-map-desc">
      <title id="module-map-title">Runtime seam module map</title>
      <desc id="module-map-desc">Dependency graph of the kinby modules the runtime seam touches: the CLI entry, REPL and contract client above the dispatcher, which fans out to threads, events, turns and the model loop, with the contracts package imported by all of them.</desc>
