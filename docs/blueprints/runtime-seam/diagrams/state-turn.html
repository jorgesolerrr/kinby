<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turn lifecycle · State machine</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · kinby runtime seam</p>
    <h1>One turn, from turn.start to a terminal event</h1>

    <svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="state-turn-title state-turn-desc">
      <title id="state-turn-title">Turn lifecycle</title>
      <desc id="state-turn-desc">State machine of one turn: it runs from turn.start, may park on approval.requested until approval.respond, and ends as completed, failed, or interrupted, after which the thread accepts a new turn.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Transitions (drawn first) -->
      <!-- start -> Running -->
      <line x1="68" y1="200" x2="160" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Running -> Completed (accent, happy path) -->
      <line x1="320" y1="200" x2="440" y2="200" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Running -> Failed (dashed, failure path) -->
      <path d="M 280 160 V 88 Q 280 80 288 80 H 440" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- Running -> WaitingApproval -->
      <line x1="220" y1="240" x2="220" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- WaitingApproval -> Running -->
      <line x1="260" y1="300" x2="260" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Running -> Interrupted -->
      <path d="M 320 224 H 352 Q 360 224 360 232 V 316 Q 360 324 368 324 H 440" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- WaitingApproval -> Interrupted -->
      <line x1="320" y1="364" x2="440" y2="364" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Transition labels -->
      <rect x="82" y="180" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="114" y="190" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TURN.START</text>

      <rect x="336" y="180" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="380" y="190" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TURN.COMPLETED</text>

      <rect x="320" y="60" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="364" y="70" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TURN.FAILED</text>

      <rect x="100" y="264" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="208" y="274" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">APPROVAL.REQUESTED</text>

      <rect x="268" y="264" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="272" y="274" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">APPROVAL.RESPOND</text>

      <rect x="368" y="268" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="372" y="278" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">TURN.INTERRUPT</text>

      <rect x="336" y="344" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="380" y="354" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TURN.INTERRUPT</text>

      <!-- Start dot -->
      <circle cx="60" cy="200" r="6" fill="#2d3142"/>

      <!-- State: Running -->
      <rect x="160" y="160" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="168" y="168" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="188" y="177" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="240" y="208" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Running</text>
      <text x="240" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">run_turn task · deltas</text>

      <!-- State: Completed (focal) -->
      <rect x="440" y="160" width="160" height="80" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="448" y="168" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="468" y="177" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="520" y="208" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Completed</text>
      <text x="520" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">usage in payload · thread idle</text>

      <!-- State: Failed -->
      <rect x="440" y="40" width="160" height="80" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="448" y="48" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="468" y="57" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="520" y="88" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Failed</text>
      <text x="520" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">error code in payload · idle</text>

      <!-- State: WaitingApproval -->
      <rect x="160" y="300" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="168" y="308" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="188" y="317" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="240" y="348" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">WaitingApproval</text>
      <text x="240" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">checkpoint · survives restart</text>

      <!-- State: Interrupted -->
      <rect x="440" y="300" width="160" height="80" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="448" y="308" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="468" y="317" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="520" y="348" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Interrupted</text>
      <text x="520" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">task cancelled · idle</text>

      <!-- Editorial asides: the two guards that produce error codes -->
      <text x="640" y="200" fill="#2d3142" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">turn.start while Running or WaitingApproval</text>
      <text x="640" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ THREAD_BUSY (retryable)</text>
      <text x="640" y="340" fill="#2d3142" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">interrupt or respond with no live turn</text>
      <text x="640" y="360" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ NO_ACTIVE_TURN</text>
      <text x="640" y="80" fill="#2d3142" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">Terminal states free the thread.</text>
      <text x="640" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">the next turn.start is accepted</text>

      <!-- Legend -->
      <line x1="60" y1="408" x2="940" y2="408" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="60" y="424" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <line x1="160" y1="421" x2="188" y2="421" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="196" y="424" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Transition, labelled with the command or event</text>
      <line x1="440" y1="421" x2="468" y2="421" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="476" y="424" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Failure path</text>
      <rect x="580" y="415" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="600" y="424" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Happy completion</text>
      <rect x="720" y="415" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="740" y="424" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Other terminal state</text>
    </svg>
  </div>
</body>
</html>
