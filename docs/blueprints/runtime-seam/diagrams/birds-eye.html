<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Runtime seam · Data flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --paper-2: #ececec; --ink: #2d3142; --muted: #4f5d75;
      --soft: #7a8399; --rule: rgba(45,49,66,0.12); --accent: #eb6c36;
      --accent-tint: rgba(235,108,54,0.08); --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    svg { display: block; width: 100%; min-width: 728px; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Data flow · kinby runtime seam</p>
    <h1>One REPL turn, from command to rendered stream</h1>

    <svg viewBox="0 0 728 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="birds-eye-title birds-eye-desc">
      <title id="birds-eye-title">Runtime seam data flow</title>
      <desc id="birds-eye-desc">A REPL command crosses the dispatcher, runs a model turn, lands as sequence-numbered events in the instance event log, and returns to the REPL through the subscription.</desc>
      <defs>
        <style>
          .step-number, .step-label, .lane-label, .role-text, .chip-text, .legend-label { font-family: 'Geist Mono', ui-monospace, monospace; text-anchor: middle; }
          .step-number { fill: #2d3142; font-size: 7px; font-weight: 600; }
          .step-label { fill: #4f5d75; font-size: 7px; font-weight: 500; letter-spacing: 0.12em; }
          .lane-label { fill: #4f5d75; font-size: 8px; font-weight: 500; letter-spacing: 0.14em; }
          .role-text { fill: #2d3142; font-size: 6px; font-weight: 600; }
          .node-title { fill: #2d3142; font: 600 9px 'Geist', system-ui, sans-serif; text-anchor: middle; }
          .node-sub { fill: #4f5d75; font: 400 6.5px 'Geist Mono', ui-monospace, monospace; text-anchor: middle; }
          .node-tool { fill: #7a8399; font: 400 6.5px 'Geist Mono', ui-monospace, monospace; text-anchor: middle; }
          .chip-text { fill: #fff; font-size: 5px; font-weight: 700; }
          .focal-text { fill: #eb6c36; }
          .legend-label { fill: #4f5d75; font-size: 7px; font-weight: 500; letter-spacing: 0.12em; text-anchor: end; }
          .legend-text { fill: #4f5d75; font: 400 7px 'Geist', system-ui, sans-serif; }
        </style>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#4f5d75"/></marker>
        <marker id="arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#eb6c36"/></marker>
        <marker id="arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="728" height="356" fill="#f5f5f5"/>
      <rect width="728" height="356" fill="url(#dots)"/>
      <rect x="0" y="36" width="728" height="80" fill="rgba(45,49,66,0.018)"/>
      <rect x="0" y="196" width="728" height="80" fill="rgba(45,49,66,0.018)"/>

      <!-- Header and lane structure -->
      <line x1="0" y1="36" x2="728" y2="36" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="116" x2="728" y2="116" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="196" x2="728" y2="196" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="276" x2="728" y2="276" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="140" y1="36" x2="140" y2="276" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <g aria-label="Pipeline steps">
        <rect x="180" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="196" y="14" class="step-number">01</text><text x="196" y="29" class="step-label">COMMAND</text>
        <rect x="292" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="308" y="14" class="step-number">02</text><text x="308" y="29" class="step-label">ADMIT</text>
        <rect x="404" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="420" y="14" class="step-number">03</text><text x="420" y="29" class="step-label">RUN</text>
        <rect x="516" y="6" width="32" height="16" rx="8" fill="rgba(235,108,54,0.20)"/><text x="532" y="14" class="step-number focal-text">04</text><text x="532" y="29" class="step-label focal-text">APPEND</text>
        <rect x="628" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="644" y="14" class="step-number">05</text><text x="644" y="29" class="step-label">STREAM</text>
      </g>

      <g aria-label="Role lanes">
        <text x="70" y="72" class="lane-label">CLI</text><text x="70" y="84" class="lane-label">CLIENT</text>
        <text x="70" y="152" class="lane-label">CORE</text><text x="70" y="164" class="lane-label">RUNTIME</text>
        <text x="70" y="232" class="lane-label">INSTANCE</text><text x="70" y="244" class="lane-label">.STATE</text>
      </g>

      <!-- Connectors first. Cross-lane paths use r=8 orthogonal elbows. -->
      <path d="M246 76 H300 Q308 76 308 84 V124" fill="none" stroke="#4f5d75" marker-end="url(#arr-muted)"/>
      <path d="M358 156 H370" fill="none" stroke="#4f5d75" marker-end="url(#arr-muted)"/>
      <path d="M470 156 H524 Q532 156 532 164 V204" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)"/>
      <path d="M582 236 H636 Q644 236 644 228 V188" fill="none" stroke="#4f5d75" marker-end="url(#arr-muted)"/>
      <path d="M644 124 V108" fill="none" stroke="#2e5aa8" marker-end="url(#arr-link)"/>
      <rect x="472" y="136" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="145" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVENT SEQ N</text>

      <!-- CLI: run_repl sends the command -->
      <rect x="146" y="44" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="150" y="48" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="159" y="53" class="role-text">CLI</text>
      <text x="196" y="67" class="node-title">run_repl</text><text x="196" y="79" class="node-sub">message → turn.start</text><text x="196" y="91" class="node-tool">cli/repl.py</text>

      <!-- CORE: Dispatcher.dispatch -->
      <rect x="258" y="124" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="262" y="128" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="271" y="133" class="role-text">COR</text>
      <text x="308" y="147" class="node-title">Dispatcher.dispatch</text><text x="308" y="159" class="node-sub">scope · validate · route</text><text x="308" y="171" class="node-tool">core/dispatcher.py</text>

      <!-- CORE: run_turn -->
      <rect x="370" y="124" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="374" y="128" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="383" y="133" class="role-text">COR</text>
      <text x="420" y="147" class="node-title">run_turn</text><text x="420" y="159" class="node-sub">Turns.start → model call</text><text x="420" y="171" class="node-tool">core/loop.py</text>

      <!-- STATE: EventLog.append (focal) -->
      <rect x="482" y="204" width="100" height="64" rx="6" fill="rgba(235,108,54,0.07)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="486" y="208" width="18" height="10" rx="3" fill="rgba(235,108,54,0.20)"/><text x="495" y="213" class="role-text focal-text">STA</text>
      <text x="532" y="227" class="node-title">EventLog.append</text><text x="532" y="239" class="node-sub">seq per thread, gap-free</text><text x="532" y="251" class="node-tool">.state/events.jsonl</text>
      <rect x="486" y="258" width="16" height="8" rx="3" fill="#4a7c59"/><text x="494" y="264" class="chip-text">LS</text>
      <rect x="562" y="258" width="16" height="8" rx="3" fill="#4a7c59"/><text x="570" y="264" class="chip-text">LS</text>

      <!-- CORE: EventLog.subscribe -->
      <rect x="594" y="124" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="598" y="128" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="607" y="133" class="role-text">COR</text>
      <text x="644" y="147" class="node-title">EventLog.subscribe</text><text x="644" y="159" class="node-sub">replay &gt; N, then live</text><text x="644" y="171" class="node-tool">core/events.py</text>
      <rect x="598" y="178" width="16" height="8" rx="3" fill="#4a7c59"/><text x="606" y="184" class="chip-text">LS</text>
      <rect x="674" y="178" width="16" height="8" rx="3" fill="#4a7c59"/><text x="682" y="184" class="chip-text">LS</text>

      <!-- CLI: run_repl renders -->
      <rect x="594" y="44" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="598" y="48" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="607" y="53" class="role-text">CLI</text>
      <text x="644" y="67" class="node-title">run_repl render</text><text x="644" y="79" class="node-sub">deltas · approvals · done</text><text x="644" y="91" class="node-tool">cli/repl.py</text>
      <rect x="598" y="98" width="16" height="8" rx="3" fill="#4a7c59"/><text x="606" y="104" class="chip-text">LS</text>

      <!-- Legend: steps -->
      <text x="164" y="293" class="legend-label">STEPS</text>
      <rect x="180" y="284" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/><text x="192" y="292" class="step-number">01</text><text x="212" y="293" class="legend-text">Command</text>
      <rect x="272" y="284" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/><text x="284" y="292" class="step-number">02</text><text x="304" y="293" class="legend-text">Admit</text>
      <rect x="360" y="284" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/><text x="372" y="292" class="step-number">03</text><text x="392" y="293" class="legend-text">Run</text>
      <rect x="468" y="284" width="24" height="12" rx="6" fill="rgba(235,108,54,0.20)"/><text x="480" y="292" class="step-number focal-text">04</text><text x="500" y="293" class="legend-text">Append</text>
      <rect x="568" y="284" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/><text x="580" y="292" class="step-number">05</text><text x="600" y="293" class="legend-text">Stream</text>

      <!-- Legend: data types -->
      <text x="164" y="314" class="legend-label">DATA TYPE</text>
      <rect x="180" y="306" width="16" height="8" rx="3" fill="#4a7c59"/><text x="188" y="312" class="chip-text">LS</text><text x="202" y="314" class="legend-text">Event stream</text>
      <text x="300" y="314" class="legend-text">left chip = input · right chip = output</text>

      <!-- Legend: flow -->
      <text x="164" y="336" class="legend-label">FLOW</text>
      <line x1="180" y1="333" x2="204" y2="333" stroke="#4f5d75" marker-end="url(#arr-muted)"/><text x="212" y="336" class="legend-text">Call or handoff</text>
      <line x1="324" y1="333" x2="348" y2="333" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)"/><text x="356" y="336" class="legend-text">D2: append with sequence</text>
      <line x1="500" y1="333" x2="524" y2="333" stroke="#2e5aa8" marker-end="url(#arr-link)"/><text x="532" y="336" class="legend-text">Rendered to the user</text>
    </svg>
  </main>
</body>
</html>
