<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turn start through the seam · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · kinby runtime seam</p>
    <h1>Turn start: subscribe, command, accepted receipt</h1>

    <svg viewBox="0 0 1000 584" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-turn-start-title flow-turn-start-desc">
      <title id="flow-turn-start-title">Turn start through the seam</title>
      <desc id="flow-turn-start-desc">Sequence of calls when the REPL subscribes to a thread and starts a turn: the dispatcher admits the command, Turns records turn.started and spawns run_turn, and the accepted receipt returns before any output.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Lifelines: 100, 300, 500, 700, 900 -->
      <line x1="100" y1="128" x2="100" y2="480" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="300" y1="128" x2="300" y2="480" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="500" y1="128" x2="500" y2="480" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="700" y1="128" x2="700" y2="480" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="900" y1="128" x2="900" y2="480" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Activation bars -->
      <rect x="296" y="168" width="8" height="40" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="296" y="248" width="8" height="168" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="496" y="280" width="8" height="104" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="696" y="344" width="8" height="136" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="896" y="200" width="8" height="8" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="896" y="312" width="8" height="8" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- Messages -->
      <!-- M1 run_repl -> Dispatcher: subscribe(thread.subscribe, after_sequence=0) -->
      <line x1="100" y1="168" x2="296" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M2 Dispatcher -> EventLog: EventLog.subscribe(thread_id, 0) -->
      <line x1="304" y1="200" x2="896" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M3 run_repl -> Dispatcher: dispatch(thread.turn.start) -->
      <line x1="100" y1="248" x2="296" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M4 Dispatcher -> Turns: Turns.start(command) -->
      <line x1="304" y1="280" x2="496" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M5 Turns -> EventLog: append(turn.started) -->
      <line x1="504" y1="312" x2="896" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M6 Turns -> run_turn: create_task (async, open head) -->
      <line x1="504" y1="344" x2="696" y2="344" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <!-- M7 Turns -> Dispatcher: return AcceptedResult -->
      <line x1="496" y1="384" x2="304" y2="384" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- M8 Dispatcher -> run_repl: accepted receipt (headline) -->
      <line x1="296" y1="416" x2="100" y2="416" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Labels -->
      <rect x="132" y="152" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="200" y="162" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">THREAD.SUBSCRIBE · 0</text>

      <rect x="340" y="184" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="400" y="194" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SUBSCRIBE · LIVE</text>

      <rect x="132" y="232" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="200" y="242" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">THREAD.TURN.START</text>

      <rect x="336" y="264" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="400" y="274" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">START · BUSY GUARD</text>

      <rect x="532" y="296" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="306" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TURN.STARTED · SEQ</text>

      <rect x="556" y="328" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="338" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CREATE_TASK</text>

      <rect x="348" y="368" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="400" y="378" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACCEPTEDRESULT</text>

      <rect x="140" y="400" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="200" y="410" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TURN_ID · SEQUENCE</text>

      <!-- Actor boxes -->
      <rect x="28" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="28" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="36" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="50" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
      <text x="100" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">run_repl</text>
      <text x="100" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cli/repl.py</text>

      <rect x="228" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="228" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="236" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="252" y="89" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <text x="300" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dispatcher</text>
      <text x="300" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">core/dispatcher.py</text>

      <rect x="428" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="428" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="436" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="452" y="89" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <text x="500" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Turns</text>
      <text x="500" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">core/turns.py · new</text>

      <rect x="628" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="628" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="636" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="652" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TASK</text>
      <text x="700" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">run_turn</text>
      <text x="700" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">core/loop.py · new</text>

      <rect x="828" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="828" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="836" y="80" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="854" y="89" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="900" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">EventLog</text>
      <text x="900" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">core/events.py · #31</text>

      <!-- Legend -->
      <line x1="28" y1="504" x2="972" y2="504" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="28" y="520" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <line x1="28" y1="546" x2="56" y2="546" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="64" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Call</text>

      <line x1="132" y1="546" x2="160" y2="546" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="168" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return</text>

      <line x1="252" y1="546" x2="280" y2="546" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <text x="288" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Async task, no reply awaited</text>

      <line x1="476" y1="546" x2="504" y2="546" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="512" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">D3: accepted receipt, before any output</text>

      <rect x="748" y="537" width="4" height="18" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="760" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Activation</text>
    </svg>
  </div>
</body>
</html>
