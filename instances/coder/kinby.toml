# The kinby coder: an instance whose workspace is the kinby repository itself.
# Secrets live in .env (see .env.example), never here.
id = "coder"

[models]
main = "anthropic:claude-opus-5"

[workspace]
path = "workspace"
source = "https://github.com/jorgesolerrr/kinby.git"

[workspace.conventions]
enabled = true
instructions = ["AGENTS.md"]

[memory]
recap = "every-turn"

[feedback]
# Routine turns have nobody to answer.
ask = "off"

[serve]
listen = "0.0.0.0:8787"

[budgets]
# One issue should not run past an hour or spend more than this in a day.
seconds = 3600
usd_per_day = 25.0

[prices."anthropic:claude-opus-5"]
input = 5.0
output = 25.0
cache_read = 0.5
cache_write = 6.25
