# Checks every pull request and every push to main. A green push to main then updates
# the coder through the hub, with a token that can only run instance updates.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run check:web
      - run: bun run --filter @kinby/web build

  update-coder:
    needs: [checks, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One update at a time, in push order. An update the hub is running is never cancelled.
    concurrency:
      group: update-coder
      cancel-in-progress: false
    env:
      # The hub's contract URL, ending /ws.
      KINBY_HUB_URL: ${{ secrets.KINBY_HUB_URL }}
    steps:
      - name: Skip until the coder runs under the hub
        if: env.KINBY_HUB_URL == ''
        run: echo "::notice::KINBY_HUB_URL is not set, so this push updates nothing."
      - if: env.KINBY_HUB_URL != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.KINBY_HUB_URL != ''
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Update the coder to this commit
        if: env.KINBY_HUB_URL != ''
        env:
          KINBY_TOKEN: ${{ secrets.KINBY_HUB_UPDATE_TOKEN }}
          KINBY_CODER_INSTANCE_ID: ${{ secrets.KINBY_CODER_INSTANCE_ID }}
        run: >-
          uv run --locked --no-dev kinby hub update
          --connect "$KINBY_HUB_URL" "$KINBY_CODER_INSTANCE_ID"
          --revision "$GITHUB_SHA"
