[project]
name = "kinby"
version = "0.1.0"
description = "An open-source, self-hosted personal AI teammate"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "langchain[anthropic,openai]>=1.0",
    "langgraph>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
kinby = "kinby.cli:main"

[project.entry-points."kinby.tools"]
defaults = "kinby.plugins.defaults:TOOLS"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "ty>=0.0.75",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "ANN", "FBT", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Parse at the boundary. Any lives only in the module that reads raw input (CODING-STANDARD.md, Types)."
"pydantic.BaseModel".msg = "Annotate the specific contract model. BaseModel is for code that routes any model (CODING-STANDARD.md, Types)."

[tool.ruff.lint.per-file-ignores]
"src/kinby/contracts/models.py" = ["TID251"] # defines ContractModel
"src/kinby/instance/manifest.py" = ["TID251"] # declares the manifest schema
"tests/**" = ["ANN", "FBT", "TID251"]

[tool.ty.rules]
blanket-ignore-comment = "error"
possibly-unresolved-reference = "error"
