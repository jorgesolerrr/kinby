[project]
name = "kinby"
version = "0.1.0"
description = "An open-source, self-hosted personal AI teammate"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.scripts]
kinby = "kinby.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]
