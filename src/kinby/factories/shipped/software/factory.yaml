# The software factory: it turns GitHub issues labeled ready-for-agent into agent pull requests,
# and answers their reviews until they are merge-ready.
# kinby ships it as a starting point. Edit it on your hub to make it your own.
name: software
instances:
  coder:
    image: coder
    setup_fields:
      - name: repository
        label: Repository
        description: >-
          The git URL of the repository the factory clones and works in, like
          https://github.com/<owner>/<repository>.git.
        kind: config
        type: url
        required: true
        target: { file: kinby.toml, key: workspace.source }
      - name: model
        label: Model
        description: The model the instance calls, as provider:model.
        kind: config
        type: text
        required: true
        default: anthropic:claude-sonnet-5
      - name: GH_TOKEN
        label: GitHub token
        description: A token with repo scope. gh, git push, issues and pull requests run as it.
        kind: secret
        type: text
        required: true
      - name: GITHUB_WEBHOOK_SECRET
        label: Webhook secret
        description: >-
          The shared secret of the repository webhook that signs each delivery. Generate one
          with `openssl rand -hex 32`.
        kind: secret
        type: text
        required: true
      - name: CLAUDE_CODE_OAUTH_TOKEN
        label: Claude Code token
        description: >-
          Claude Code's subscription token. Run `claude setup-token` on your own machine and
          paste the token it prints.
        kind: secret
        type: text
        required: true
      - name: GIT_USER_NAME
        label: Commit author name
        description: The name on the commits the coding clients make.
        kind: secret
        type: text
        required: true
      - name: GIT_USER_EMAIL
        label: Commit author email
        description: >-
          The email on the commits the coding clients make. Use one GitHub links to the
          token's account, so the commits show as its own.
        kind: secret
        type: text
        required: true
intake: { instance: coder, routine: scan }
work_item: { issue: int }
steps:
  # Checks who wrote the ticket (ADR 0073), then checks out a fresh agent branch from its base.
  - id: prepare
    kind: code
    in: coder
    call: prepare_branch
    results: { branch: str, base: str }
  # Installs the dependencies of a repository on uv and bun, as kinby is. Replace the installs
  # with your repository's.
  - id: setup
    kind: command
    in: coder
    requires: [branch]
    run:
      - git switch {{branch}}
      - uv sync --frozen
      - bun install --frozen-lockfile
  # Every client step continues implement's session, so one coding session per issue writes the
  # change, answers its reviews and repairs its checks. It writes the pull request's title, body
  # and replies; publish applies them (ADR 0081).
  - id: implement
    kind: client
    in: coder
    client: claude
    model: claude-opus-5-5
    effort: high
    prompt: prompts/implement.md
    hook: check_implementation
    requires: [branch, base]
    timeout: 60m
  # A fix round: the coding client answers the review threads trusted authors left on the pull
  # request, commits its fixes, and rewrites the title and body where the round changed them.
  # Work is only ever sent back, so it comes before the pull request opens, and finds no threads
  # to answer the first time.
  - id: answer
    kind: client
    in: coder
    client: claude
    model: claude-opus-5-5
    effort: high
    resume: implement
    prompt: prompts/answer.md
    hook: check_answers
    requires: [branch, base]
    results: { replies: str }
    timeout: 60m
  # A check repair (ADR 0080): the coding client fixes what the failed checks sent back as
  # results.failure, and changes nothing when nothing failed. It comes after answer, so a repair
  # during babysitting keeps the round's replies, its feedback and the pull request.
  - id: fix
    kind: client
    in: coder
    client: claude
    model: claude-opus-5-5
    effort: high
    resume: implement
    prompt: prompts/fix.md
    hook: check_implementation
    requires: [branch, base]
    timeout: 30m
  # Adversarial review before the pull request opens is off by default (ADR 0044): reviewers
  # on the pull request take its place. To turn it on, uncomment review. It sends changes back
  # to fix, which then reads its .scratch/review.md.
  # - id: review
  #   kind: client
  #   in: coder
  #   client: claude
  #   model: claude-opus-5-5
  #   effort: high
  #   prompt: prompts/review.md
  #   hook: read_review_verdict
  #   requires: [branch, base]
  #   results: { reviewed: bool }
  #   outcomes: { clean: next, changes: { back: fix, max: 2 } }
  #   timeout: 15m
  # kinby's checks. Replace the installs and `bun run check` with your repository's. Other runs'
  # steps share the workspace, so the first command puts it back on this run's branch. A failure
  # goes back to fix with the failing command and the tail of its output, at most twice.
  - id: checks
    kind: command
    in: coder
    requires: [branch]
    run:
      - git switch {{branch}}
      - uv sync --frozen
      - bun install --frozen-lockfile
      - bun run check
    failed: { back: fix, max: 2 }
  # Pushes the branch. The first time, it opens the pull request; after a fix round, it applies
  # the title and body the session rewrote, and replies on each thread the round answered. Never
  # retried, so a pull request is never opened twice.
  - id: publish
    kind: code
    in: coder
    call: publish_pull_request
    requires: [branch, base]
    results: { pr: int }
    retry: 0
  # Babysitting. The run holds nothing while it waits for a review of its pull request, a reply
  # on one of its review threads, a check suite that finished on its branch, or the pull request
  # closing. The repository's webhook must send all four events. After 20 quiet minutes with none
  # of them, the wait moves on by itself and assess stops waiting for a reviewer.
  - id: babysit
    kind: wait
    signal:
      - headers.X-GitHub-Event: pull_request_review
        body.pull_request.number: "{{pr}}"
      - headers.X-GitHub-Event: pull_request_review_comment
        body.pull_request.number: "{{pr}}"
      - headers.X-GitHub-Event: check_suite
        body.action: completed
        body.check_suite.head_branch: "{{branch}}"
      - headers.X-GitHub-Event: pull_request
        body.action: closed
        body.pull_request.number: "{{pr}}"
    quiet: 20m
    results: { quiet: bool }
  # Reads the pull request. Merge-ready, it labels it merge-ready and asks the maintainer for a
  # review, and the run is done; it never merges. Merged by someone, the run is done too; closed
  # without a merge, it stops. Threads to answer start a fix round, at most 3 before the run
  # needs a human. Anything else waits for the next wake.
  - id: assess
    kind: code
    in: coder
    call: assess_pull_request
    requires: [pr]
    results: { feedback: str, pr: int, merge_ready: bool }
    outcomes:
      merge-ready: done
      merged: done
      closed: stop
      feedback: { back: answer, max: 3 }
      waiting: { back: babysit, max: 30 }
done_requires: [merge_ready]
# Labels the issue ready-for-human with the summary of the step the run stopped at. The branch
# stays, with everything committed on it.
needs_human: { in: coder, call: report_needs_human }
