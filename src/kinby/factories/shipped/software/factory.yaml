# The software factory: it turns GitHub issues labeled ready-for-agent into agent pull requests,
# and answers their reviews until they are merge-ready.
# kinby ships it as a starting point. Edit it on your hub to make it your own.
name: software
# A workbench whose workspace is a clone of the repository the factory works in. A workbench that
# holds no setup or checks list takes no line: ask its line's owner for a repository survey.
requires:
  image: coder
  secrets:
    - name: GH_TOKEN
      label: GitHub token
      description: A token with repo scope. gh, git push, issues and pull requests run as it.
      type: text
      required: true
    - name: CLAUDE_CODE_OAUTH_TOKEN
      label: Claude Code token
      description: >-
        Claude Code's subscription token. Run `claude setup-token` on your own machine and paste
        the token it prints.
      type: text
      required: true
    - name: GIT_USER_NAME
      label: Commit author name
      description: The name on the commits the coding clients make.
      type: text
      required: true
    - name: GIT_USER_EMAIL
      label: Commit author email
      description: >-
        The email on the commits the coding clients make. Use one GitHub links to the token's
        account, so the commits show as its own.
      type: text
      required: true
  commands: [setup, checks]
  suggested_picks:
    - adversarial-review
    - api-and-interface-design
    - codebase-design
    - no-comments
    - ponytail
    - pr
    - tdd
    - unslop
# Each hour, and on each delivery that can change which issue is eligible, finds the oldest
# eligible issue and any issue a human labeled ready-for-agent again while it was ready-for-human.
# The repository's webhook points at the line's address, signed with the owner's
# GITHUB_WEBHOOK_SECRET.
intake:
  call: scan_ready_issues
  schedule: 0 * * * *
  delivery:
    auth: hmac-sha256
    secret: GITHUB_WEBHOOK_SECRET
    signature_header: X-Hub-Signature-256
    delivery_header: X-GitHub-Delivery
work_item: { issue: int }
# Names the run worktree's agent branch, agent/<issue>-<title words>, and its base: the branch
# that holds every open blocker's agent branch, so the pull request stacks on their work, or the
# default branch with no blocker open. Sent back to its first step, the run starts over from the
# base, named again.
worktree: { call: agent_branch }
steps:
  # Passes the ticket on only once a trusted author wrote all its text (ADR 0073).
  - id: ticket
    kind: code
    call: vet_ticket
  # Runs the workbench's setup list of repository commands in the run worktree, which has
  # installs of its own.
  - id: setup
    kind: command
    run:
      - { commands: setup }
  # Every agent step continues implement's session, so one coding session per issue writes the
  # change, answers its reviews and repairs its checks. It writes the pull request's title, body
  # and replies. Each step's check records them as the run's values, and publish applies them
  # (ADRs 0081 and 0083). Every agent step runs in the run's own run worktree, so the session
  # resumes from the directory it started in, and no other run's steps touch it. A ticket with
  # nothing to do ends the run cancelled with no commit, once the session wrote why as no_change.
  - id: implement
    kind: agent
    engine: claude
    model: claude-opus-5-5
    effort: high
    prompt: prompts/implement.md
    check: check_implementation
    requires: [branch, base]
    results: { title: str, body: str, no_change: str }
    outcomes: { no-change: stop }
    timeout: 60m
  # A fix round: the coding client answers the review threads trusted authors left on the pull
  # request, commits its fixes, and rewrites the title and body where the round changed them.
  # Work is only ever sent back, so it comes before the pull request opens, and finds no threads
  # to answer the first time or in a check repair.
  - id: answer
    kind: agent
    engine: claude
    model: claude-opus-5-5
    effort: high
    resume: implement
    prompt: prompts/answer.md
    check: check_answers
    requires: [branch, base]
    results: { replies: str, title: str, body: str }
    timeout: 60m
  # A check repair (ADR 0080): the coding client fixes what the failed checks sent back as
  # results.failure, and changes nothing when nothing failed. It comes after answer, so a repair
  # during babysitting keeps the round's replies, its feedback and the pull request.
  - id: fix
    kind: agent
    engine: claude
    model: claude-opus-5-5
    effort: high
    resume: implement
    prompt: prompts/fix.md
    check: check_implementation
    requires: [branch, base]
    results: { title: str, body: str }
    timeout: 30m
  # Adversarial review before the pull request opens is off by default (ADR 0044): reviewers
  # on the pull request take its place. To turn it on, uncomment review. It sends changes back
  # to fix, which then reads its .scratch/review.md.
  # - id: review
  #   kind: agent
  #   engine: claude
  #   model: claude-opus-5-5
  #   effort: high
  #   prompt: prompts/review.md
  #   check: read_review_verdict
  #   requires: [branch, base]
  #   results: { reviewed: bool }
  #   outcomes: { clean: next, changes: { back: fix, max: 2 } }
  #   timeout: 15m
  # Runs the workbench's setup list again in the run worktree, so a change to the dependencies is
  # checked against fresh installs, then its checks list. A failure goes back to fix with the
  # failing command and the tail of its output, at most twice.
  - id: checks
    kind: command
    run:
      - { commands: setup }
      - { commands: checks }
    failed: { back: fix, max: 2 }
  # Pushes the branch. The first time, it opens the pull request; after a fix round, it applies
  # the title and body the session rewrote, and replies on each thread the round answered. Never
  # retried, so a pull request is never opened twice.
  - id: publish
    kind: code
    call: publish_pull_request
    requires: [branch, base]
    results: { pr: int }
    retry: 0
  # Babysitting. The run holds nothing while it waits for a review of its pull request, a reply
  # on one of its review threads, a check suite that finished on its branch, or the pull request
  # closing. The repository's webhook must send all four events. After 20 quiet minutes with none
  # of them, the wait moves on by itself and assess stops waiting for a reviewer.
  - id: babysit
    kind: wait
    signal:
      - headers.X-GitHub-Event: pull_request_review
        body.pull_request.number: "{{pr}}"
      - headers.X-GitHub-Event: pull_request_review_comment
        body.pull_request.number: "{{pr}}"
      - headers.X-GitHub-Event: check_suite
        body.action: completed
        body.check_suite.head_branch: "{{branch}}"
      - headers.X-GitHub-Event: pull_request
        body.action: closed
        body.pull_request.number: "{{pr}}"
    quiet: 20m
    results: { quiet: bool }
  # Reads the pull request. Merge-ready, it labels it merge-ready and asks the maintainer for a
  # review, and the run is done; it never merges. Merged by someone, the run is done too; closed
  # without a merge, it stops. Threads to answer start a fix round, at most 3 before the run
  # needs a human. With none, checks that failed on the head start a check repair, at most
  # twice. It goes back to answer, which finds no threads, so a repair whose own checks fail
  # keeps the failed checks and the pull request (ADR 0086). Fix rounds and check repairs share
  # one count. Anything else waits for the next wake.
  - id: assess
    kind: code
    call: assess_pull_request
    requires: [pr]
    results: { feedback: str, failure: str, pr: int, merge_ready: bool }
    outcomes:
      merge-ready: done
      merged: done
      closed: stop
      feedback: { back: answer, max: 3 }
      checks-failed: { back: answer, max: 2 }
      waiting: { back: babysit, max: 30 }
done_requires: [merge_ready]
# Pushes the branch if it has commits ahead of its base, and leaves the run worktree as it is.
# Then labels the issue ready-for-human and comments the step the run stopped at and why, the run
# id, how to retry, and the open issues blocked behind it.
needs_human: { call: report_needs_human }
# Once a run ends done or cancelled: takes ready-for-human off the issue, and after no change,
# comments why and takes ready-for-agent off. It never closes the issue (ADR 0105). kinby then
# removes the run worktree and its local branch.
ended: { call: report_ended }
# A run that needs human ends once its work finished elsewhere: done when its pull request is
# merged, cancelled when its issue is closed or its pull request is closed unmerged. The ended call
# then takes ready-for-human off the issue. The repository's webhook must send issues events.
closing:
  done:
    - headers.X-GitHub-Event: pull_request
      body.action: closed
      body.pull_request.number: "{{pr}}"
      body.pull_request.merged: true
  cancelled:
    - headers.X-GitHub-Event: issues
      body.action: closed
      body.issue.number: "{{issue}}"
    - headers.X-GitHub-Event: pull_request
      body.action: closed
      body.pull_request.number: "{{pr}}"
      body.pull_request.merged: false
